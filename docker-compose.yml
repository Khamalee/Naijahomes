services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: naijahomes
      POSTGRES_USER: naijahomes
      POSTGRES_PASSWORD: naijahomes_dev_password
    ports:
      - "5432:5432"
    volumes:
      - naijahomes_pg:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
  app:
    build: .
    depends_on:
      - db
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://naijahomes:naijahomes_dev_password@db:5432/naijahomes
      JWT_SECRET: local_demo_change_me_to_a_long_random_secret
      CORS_ORIGIN: http://localhost:4000
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    ports:
      - "4000:4000"
volumes:
  naijahomes_pg:
